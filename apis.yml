apis:
- aid: trunk:test-uploads-api
  name: Trunk Test Uploads (Analytics CLI)
  tags:
  - Test Uploads
  - CI Integration
  - JUnit
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.trunk.io/flaky-tests/uploader
  baseURL: https://api.trunk.io
  description: CI test-result ingestion surface. The trunk-analytics-cli (and the trunk-io/analytics-uploader
    GitHub Action) uploads JUnit XML, Bazel BEP, and XCResult test reports to Trunk for flaky-test detection,
    authenticated with an organization slug (--org-url-slug) and API token (--token / TRUNK_API_TOKEN).
  properties:
  - url: https://docs.trunk.io/flaky-tests/uploader
    type: Documentation
  - url: https://docs.trunk.io/flaky-tests/get-started/ci-providers/github-actions
    type: GettingStarted
- aid: trunk:webhooks-api
  name: Trunk Webhooks
  tags:
  - Webhooks
  - Events
  - Svix
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.trunk.io/flaky-tests/webhooks
  baseURL: https://api.trunk.io
  description: Svix-powered outbound webhooks for subscribing to Flaky Tests events (test_case.status_changed,
    test_case.monitor_status_changed, test_case.investigation_completed) and Merge Queue events (pull_request.*
    and pull_request_batch.*). Used to trigger downstream workflows like GitHub Issues.
  properties:
  - url: https://docs.trunk.io/flaky-tests/webhooks
    type: Documentation
  - url: asyncapi/trunk-webhooks.yml
    type: Webhooks
- aid: trunk:code-quality-cli
  name: Trunk Code Quality CLI
  tags:
  - Code Quality
  - Meta-Linter
  - Static Analysis
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.trunk.io/code-quality
  baseURL: https://docs.trunk.io/code-quality
  description: Meta-linter and static analysis manager exposed through the trunk CLI and a local daemon
    (no public REST API). Commands include trunk init, trunk check, and trunk check --all; it hermetically
    installs and runs third-party linters, formatters, and security scanners, operating in Hold The Line
    mode by default and serving real-time annotations to IDE extensions.
  properties:
  - url: https://docs.trunk.io/code-quality
    type: Documentation
  - url: https://docs.trunk.io/cli
    type: Documentation
