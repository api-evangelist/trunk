aid: trunk
name: Trunk
description: Trunk builds developer experience and CI reliability tooling. Its platform spans Code Quality
  (a meta-linter and static analysis manager driven by the trunk CLI), a flake-aware parallel Merge Queue,
  and Flaky Tests detection / CI Analytics. Test results are uploaded from CI via the Trunk Analytics
  CLI / GitHub Action, and an HTTP REST API at api.trunk.io exposes Flaky Tests and Merge Queue control
  plus Svix-powered outbound webhooks. Trunk is a portfolio company of a16z.
